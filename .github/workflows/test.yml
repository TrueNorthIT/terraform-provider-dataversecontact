name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
      - run: go mod download
      - run: go build -v .

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
      # v8 installs golangci-lint v2, built with a Go new enough for this
      # module's go directive (v6/golangci-lint v1 refuses go >= 1.25).
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
      # The acceptance tests in internal/provider drive a real terraform
      # binary against internal/fakeapi, with no secrets.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: go mod download
      - run: >-
          go test ./... -v -timeout 30m
          -coverpkg=./internal/client/...,./internal/resources/...,./internal/datasources/...,./internal/provider/...
          -coverprofile=coverage.out
      # Provider code only; the test fake is excluded above.
      - name: Coverage at least 90%
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          echo "Coverage: ${total}%" >> "$GITHUB_STEP_SUMMARY"
          awk -v t="$total" 'BEGIN { if (t < 90) { print "coverage " t "% is below 90%"; exit 1 } }'

  docs:
    name: Docs up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false # tfplugindocs needs the raw binary
      - run: go generate ./...
      - run: git diff --exit-code -- docs/ examples/
      - run: go tool tfplugindocs validate --provider-name dataversecontact

  validate-examples:
    name: Validate Examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: ./scripts/validate-examples.sh

  # Reserved for tests against a real API instance (resource.Test, gated on
  # TF_ACC). There are none yet, so this re-runs the fake-backed suite.
  # Only runs on main branch pushes (not PRs) to avoid exposing secrets
  acceptance:
    name: Acceptance Tests
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TF_ACC: "1"
      DATAVERSE_CONTACT_API_URL: ${{ secrets.DATAVERSE_CONTACT_API_URL }}
      DATAVERSE_CONTACT_CONNECTION_KEY: ${{ secrets.DATAVERSE_CONTACT_CONNECTION_KEY }}
      # Deprecated fallback until the connection-key secret is configured
      DATAVERSE_CONTACT_API_KEY: ${{ secrets.DATAVERSE_CONTACT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: go mod download
      - run: go test ./... -v -timeout 120m

  # ── Security (report-only) ─────────────────────────────────────────────
  # Both jobs have continue-on-error, so a finding shows as a warning and
  # blocks nothing. Once the current findings are fixed, delete those lines
  # and make the jobs required checks.

  # Known vulnerabilities in the module's dependencies and the Go standard
  # library — only ones the provider's code actually reaches. Uses the Go
  # version in go.mod, which is what releases are built with.
  govulncheck:
    name: Go vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true # report-only — remove to make this a gate
    env:
      # govulncheck itself needs a newer Go than go.mod pins; let `go install`
      # fetch that toolchain rather than fail.
      GOTOOLCHAIN: auto
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: "go.mod"

  # Secrets committed anywhere in the history. The gitleaks GitHub Action
  # needs a paid licence for organisation repos; the CLI image does not.
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true # report-only — remove to make this a gate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            git /repo --redact --no-banner
